name: Report a bug
description: Tell us what went wrong. A partial report is welcome.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Fill in what you know; you do not need to diagnose it first.
        Issues and attachments are public. Leave out passwords, server addresses, clipboard contents, and personal desktop data.
        For a possible vulnerability, use the [security reporting guidance](https://github.com/py-killer/lantern-vnc/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Lantern version, build, and macOS version, if known
      description: "Help → Save Feedback… includes these details. Review the file before attaching it."
      placeholder: "Lantern 1.1.0 Preview 1, build 2; macOS 26.6"
  - type: input
    id: server
    attributes:
      label: VNC server and version
      description: "Server product/version only. Do not include its address or password."
      placeholder: "TightVNC Server 2.x"
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "A short sequence is enough. If you cannot reproduce it, say what you were doing when it happened."
  - type: textarea
    id: display
    attributes:
      label: Display setup, if relevant
      description: "For a display/input issue: remote resolution, Mac display, window size, zoom, and whether Hand or View only is on. Mention display switching if it triggers the problem. Approximate values are useful."
      placeholder: "Remote 5120×2880; MacBook Retina; window about 1180×760; 100%; Hand off; bottom-right corner unreachable."
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: "Optional redacted screenshot or feedback notes. Prefer synthetic test content. Saving a feedback file does not submit it automatically."
