name: Suggest a feature
description: Explain a task Lantern could support better.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Describe the task behind your idea. This issue is public; leave out private server details and personal information."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the problem or workflow, including any current workaround.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What behavior would help?
      description: Describe the result you want. A specific interface is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or context
      description: Optional examples, display setup, or related issues. Redact private information.
